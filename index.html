<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AyaMark</title>

<meta name="theme-color" content="#ff3d6e">

<link rel="manifest" href="manifest.json">

<link rel="icon"
href="assets/icons/favicon.ico">

<!-- CSS -->

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/intro.css">

<link rel="stylesheet" href="css/background.css">

<link rel="stylesheet" href="css/profile.css">

<link rel="stylesheet" href="css/player.css">

<link rel="stylesheet" href="css/settings.css">

<link rel="stylesheet" href="css/effects.css">

<link rel="stylesheet" href="css/themes.css">

<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ========================= -->
<!-- VIDEO BACKGROUND -->
<!-- ========================= -->

<div id="background">

<video
id="bgVideo"
autoplay
muted
loop
playsinline
preload="auto">

<source
src="assets/videos/bg01.mp4"
type="video/mp4">

</video>

<div id="backgroundOverlay"></div>

</div>

<!-- ========================= -->
<!-- SAKURA -->
<!-- ========================= -->

<canvas id="sakura"></canvas>

<!-- ========================= -->
<!-- INTRO -->
<!-- ========================= -->

<section id="intro">

<div class="intro-card">

<img
src="assets/icons/logo.png"
class="logo">

<h1>

AyaMark

</h1>

<p id="loadingText">

Initializing...

</p>

<div class="loading">

<div id="loadingBar"></div>

</div>

<div class="status">

<div>

✓ Music Ready

</div>

<div>

✓ Effects Enabled

</div>

<div>

✓ Mobile Optimized

</div>

</div>

<button id="enterButton">

Click Anywhere

</button>

</div>

</section>

<!-- ========================= -->
<!-- PROFILE -->
<!-- ========================= -->

<main id="app">

<section class="profile">

<img
class="avatar"
src="assets/avatar/avatar.png">

<h2>

AyaMark

</h2>

<p>

Developer • Gamer • Designer

</p>

<div class="playing">

<span class="online"></span>

Currently Playing

<strong>

Blox Fruits

</strong>

</div>

<div class="views">

👀

<span id="viewCounter">

312.4K

</span>

Views

</div>

</section>

<!-- MUSIC -->

<section class="musicPlayer">

<img
src="assets/music/cover.jpg"
class="cover">

<div class="musicInfo">

<h3>

Summer Nights

</h3>

<p>

Aya Playlist

</p>

</div>

<div class="controls">

<button id="prev">

⏮

</button>

<button id="play">

▶

</button>

<button id="next">

⏭

</button>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</section>

<!-- SOCIAL -->

<section class="social">

<a href="#" class="btn">

Discord

</a>

<a href="#" class="btn">

TikTok

</a>

<a href="#" class="btn">

YouTube

</a>

<a href="#" class="btn">

Facebook

</a>

</section>

</main>

<!-- AUDIO -->

<audio
id="audio"
preload="auto">

<source
src="assets/music/songs/song1.mp3"
type="audio/mpeg">

</audio>

<!-- JS -->

<script src="config.js"></script>

<script src="js/app.js"></script>

<script src="js/intro.js"></script>

<script src="js/background.js"></script>

<script src="js/music.js"></script>

<script src="js/profile.js"></script>

<script src="js/effects.js"></script>

<script src="js/settings.js"></script>

<script src="js/views.js"></script>

<script src="js/pwa.js"></script>

</body>

</html>
